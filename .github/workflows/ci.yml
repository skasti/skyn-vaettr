name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
      - name: Run tests
        run: gradle test --no-daemon
      - name: Render example reports
        run: gradle renderExampleReports --no-daemon
      - name: Upload example reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: example-reports
          path: build/reports/examples
          if-no-files-found: warn

  publish-report:
    needs: test
    if: >
      needs.test.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Download example reports
        uses: actions/download-artifact@v7
        with:
          name: example-reports
          path: build/reports/examples

      - name: Publish example reports
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RESULTS_BRANCH: ci-results
        shell: bash
        run: |
          set -euo pipefail

          reports_root="build/reports/examples"
          comment_marker='<!-- example-reports -->'

          test -d "$reports_root"

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RESULTS_BRANCH" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$RESULTS_BRANCH" \
              -f sha="$BASE_SHA" >/dev/null
          fi

          publish_file() {
            source_file="$1"
            target="$2"
            encoded_file=$(mktemp)
            payload_file=$(mktemp)
            base64 -w0 "$source_file" > "$encoded_file"

            published=false
            for attempt in 1 2 3; do
              existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$RESULTS_BRANCH" --jq '.sha' 2>/dev/null || true)
              if [ -n "$existing_sha" ]; then
                jq -n \
                  --rawfile content "$encoded_file" \
                  --arg message "ci: update PR $PR_NUMBER report artifact" \
                  --arg branch "$RESULTS_BRANCH" \
                  --arg sha "$existing_sha" \
                  '{message: $message, content: $content, branch: $branch, sha: $sha}' > "$payload_file"
              else
                jq -n \
                  --rawfile content "$encoded_file" \
                  --arg message "ci: publish PR $PR_NUMBER report artifact" \
                  --arg branch "$RESULTS_BRANCH" \
                  '{message: $message, content: $content, branch: $branch}' > "$payload_file"
              fi

              if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input "$payload_file" >/dev/null 2>&1; then
                published=true
                break
              fi
              sleep "$attempt"
            done

            rm -f "$encoded_file" "$payload_file"
            [ "$published" = true ] || { echo "Failed to publish $target" >&2; exit 1; }
          }

          raw_base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RESULTS_BRANCH/pr-$PR_NUMBER/examples"
          comment_file=$(mktemp)
          printf '%s\n' "$comment_marker" > "$comment_file"

          found_report=false
          while IFS= read -r -d '' report_dir; do
            summary="$report_dir/summary.md"
            [ -f "$summary" ] || continue
            found_report=true

            report_name=$(basename "$report_dir")
            printf '\n' >> "$comment_file"
            cat "$summary" >> "$comment_file"

            while IFS= read -r -d '' image; do
              image_name=$(basename "$image")
              publish_file "$image" "pr-$PR_NUMBER/examples/$report_name/$image_name"
              label=$(basename "$image_name" .png | tr '-' ' ')
              printf '\n### %s\n\n![%s](%s/%s/%s?run=%s)\n' \
                "$label" "$label" "$raw_base" "$report_name" "$image_name" "$GITHUB_RUN_ID" \
                >> "$comment_file"
            done < <(find "$report_dir" -maxdepth 1 -type f -name '*.png' -print0 | sort -z)
          done < <(find "$reports_root" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)

          [ "$found_report" = true ] || { echo "No example report summaries found" >&2; exit 1; }

          existing_comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$comment_marker\")) | .id" | head -n1)
          payload=$(mktemp)
          jq -Rs '{body: .}' "$comment_file" > "$payload"

          if [ -n "$existing_comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi

          cat "$comment_file" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$comment_file" "$payload"
