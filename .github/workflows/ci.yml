name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"
      - name: Run tests
        run: gradle test --no-daemon
      - name: Render example reports
        run: gradle renderExampleReports --no-daemon
      - name: Upload example reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: example-reports
          path: build/reports/examples
          if-no-files-found: warn

  publish-report:
    needs: test
    if: >
      needs.test.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Download example reports
        uses: actions/download-artifact@v7
        with:
          name: example-reports
          path: build/reports/examples

      - name: Publish example graphs and summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RESULTS_BRANCH: ci-results
        shell: bash
        run: |
          set -euo pipefail

          thermal_dir="build/reports/examples/thermal-expectation"
          kitchen_dir="build/reports/examples/kitchen-light"
          thermal_summary="$thermal_dir/summary.md"
          kitchen_summary="$kitchen_dir/summary.md"
          comment_marker='<!-- example-reports -->'
          report_days=(1 3 5 10)

          test -f "$thermal_summary"
          test -f "$thermal_dir/day.png"
          test -f "$kitchen_summary"
          test -f "$kitchen_dir/day.png"
          for day in "${report_days[@]}"; do
            test -f "$thermal_dir/attention-day-$day.png"
            test -f "$thermal_dir/target-signal-day-$day.png"
            test -f "$kitchen_dir/attention-day-$day.png"
            test -f "$kitchen_dir/target-signal-day-$day.png"
          done

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RESULTS_BRANCH" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$RESULTS_BRANCH" \
              -f sha="$BASE_SHA" >/dev/null
          fi

          publish_graph() {
            graph="$1"
            target="$2"
            description="$3"
            encoded_file=$(mktemp)
            payload_file=$(mktemp)
            base64 -w0 "$graph" > "$encoded_file"

            published=false
            for attempt in 1 2 3; do
              existing_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$RESULTS_BRANCH" --jq '.sha' 2>/dev/null || true)
              if [ -n "$existing_sha" ]; then
                jq -n --rawfile content "$encoded_file" --arg message "ci: update PR $PR_NUMBER $description" --arg branch "$RESULTS_BRANCH" --arg sha "$existing_sha" \
                  '{message: $message, content: $content, branch: $branch, sha: $sha}' > "$payload_file"
              else
                jq -n --rawfile content "$encoded_file" --arg message "ci: publish PR $PR_NUMBER $description" --arg branch "$RESULTS_BRANCH" \
                  '{message: $message, content: $content, branch: $branch}' > "$payload_file"
              fi
              if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input "$payload_file" >/dev/null 2>&1; then
                published=true
                break
              fi
              sleep "$attempt"
            done
            rm -f "$encoded_file" "$payload_file"
            [ "$published" = true ] || exit 1
          }

          publish_graph "$thermal_dir/day.png" "pr-$PR_NUMBER/examples/thermal-expectation/day.png" "thermal day 10 graph"
          publish_graph "$kitchen_dir/day.png" "pr-$PR_NUMBER/examples/kitchen-light/day.png" "kitchen day 10 graph"
          for day in "${report_days[@]}"; do
            publish_graph "$thermal_dir/attention-day-$day.png" "pr-$PR_NUMBER/examples/thermal-expectation/attention-day-$day.png" "thermal attention day $day"
            publish_graph "$thermal_dir/target-signal-day-$day.png" "pr-$PR_NUMBER/examples/thermal-expectation/target-signal-day-$day.png" "thermal target signal day $day"
            publish_graph "$kitchen_dir/attention-day-$day.png" "pr-$PR_NUMBER/examples/kitchen-light/attention-day-$day.png" "kitchen attention day $day"
            publish_graph "$kitchen_dir/target-signal-day-$day.png" "pr-$PR_NUMBER/examples/kitchen-light/target-signal-day-$day.png" "kitchen target signal day $day"
          done

          raw_base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RESULTS_BRANCH/pr-$PR_NUMBER/examples"
          comment_file=$(mktemp)
          {
            printf '%s\n\n' "$comment_marker"
            cat "$thermal_summary"
            printf '\n### Thermal world — day 10 observations\n\n![Thermal world](%s/thermal-expectation/day.png?run=%s)\n' "$raw_base" "$GITHUB_RUN_ID"
            for day in "${report_days[@]}"; do
              printf '\n### Thermal attention — day %s\n\n![Thermal attention day %s](%s/thermal-expectation/attention-day-%s.png?run=%s)\n' "$day" "$day" "$raw_base" "$day" "$GITHUB_RUN_ID"
              printf '\n### Thermal target-signal prediction — day %s\n\n![Thermal target signal day %s](%s/thermal-expectation/target-signal-day-%s.png?run=%s)\n' "$day" "$day" "$raw_base" "$day" "$GITHUB_RUN_ID"
            done
            printf '\n---\n\n'
            cat "$kitchen_summary"
            printf '\n### Kitchen day 10 observations\n\n![Kitchen dimmer and light](%s/kitchen-light/day.png?run=%s)\n' "$raw_base" "$GITHUB_RUN_ID"
            for day in "${report_days[@]}"; do
              printf '\n### Kitchen attention — day %s\n\n![Kitchen attention day %s](%s/kitchen-light/attention-day-%s.png?run=%s)\n' "$day" "$day" "$raw_base" "$day" "$GITHUB_RUN_ID"
              printf '\n### Kitchen target-signal prediction — day %s\n\n![Kitchen target signal day %s](%s/kitchen-light/target-signal-day-%s.png?run=%s)\n' "$day" "$day" "$raw_base" "$day" "$GITHUB_RUN_ID"
            done
          } > "$comment_file"

          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$comment_marker\") or contains(\"<!-- thermal-expectation-report -->\")) | .id" \
            | while read -r comment_id; do
                [ -z "$comment_id" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
              done

          jq -Rs '{body: .}' "$comment_file" | gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null
          cat "$comment_file" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$comment_file"
